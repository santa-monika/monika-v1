name: crawl-archive
# Lay chi muc URL (CDX, chi metadata) cua cac site da dong tren archive.org, ghi vao repo du lieu rieng. Chay tay.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Ten mien, cach nhau dau cach"
        required: false
        default: "giaitri321.pro wapvip.pro"
      delay:
        description: "Giay giua hai yeu cau"
        required: false
        default: "3"
      data_branch:
        description: "Nhanh cua repo du lieu de ghi"
        required: false
        default: "claude/project-thread-a5xs4x"

permissions:
  contents: read

concurrency:
  group: crawl-archive
  cancel-in-progress: false

jobs:
  cdx:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: santa-monika/monika-sideproject
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: ${{ inputs.data_branch }}
          path: data-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CDX
        env:
          SITES: ${{ inputs.sites }}
          DELAY: ${{ inputs.delay }}
        run: python -m crawler.archive_cdx --out data-repo/data --sites $SITES --delay "$DELAY"
      - name: Ghi vao repo du lieu rieng
        working-directory: data-repo
        run: |
          git config user.name "monika-crawler"
          git config user.email "noreply@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "khong co thay doi"; exit 0; fi
          git commit -m "data: archive cdx $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${{ inputs.data_branch }}
