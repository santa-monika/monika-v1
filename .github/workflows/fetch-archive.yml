name: fetch-archive
# Tai JAR cua nguon da dong tu archive.org theo danh muc (data/inventory/<src>.jsonl trong repo du lieu), kiem tra, lam sach quang cao,
# dedupe sha256, dua len Pixeldrain (secret PD_KEY), ghi ket qua vao data/inventory/<src>-state-<shard>.jsonl moi 30 phut.
# Chia theo nhom game cho N runner chay song song (moi runner van nghi >= delay giay giua hai yeu cau). Dung ngay khi gap 429. Chay tay.
on:
  workflow_dispatch:
    inputs:
      src:
        description: "gt321 hoac wvip"
        required: true
        default: "gt321"
      nshards:
        description: "So runner song song (1-6)"
        required: false
        default: "4"
      delay:
        description: "Giay giua hai yeu cau cua moi runner (nen >= 3 voi archive.org)"
        required: false
        default: "4"
      loops:
        description: "So vong 30 phut (toi da 10)"
        required: false
        default: "10"
      data_branch:
        description: "Nhanh cua repo du lieu"
        required: false
        default: "claude/project-thread-a5xs4x"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        env:
          N: ${{ inputs.nshards }}
        run: |
          n=$(( N > 6 ? 6 : N )); [ "$n" -lt 1 ] && n=1
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    concurrency:
      group: fetch-archive-${{ inputs.src }}-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: santa-monika/monika-sideproject
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: ${{ inputs.data_branch }}
          path: data-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiem tra PD_KEY
        env:
          PD_KEY: ${{ secrets.PD_KEY }}
        run: |
          if [ -z "$PD_KEY" ]; then echo "PD_KEY chua duoc dat trong secrets cua repo"; exit 1; fi
          echo "PD_KEY da co (${#PD_KEY} ky tu)"
      - name: Tai, kiem tra, up Pixeldrain (moi 30 phut ghi state)
        env:
          PD_KEY: ${{ secrets.PD_KEY }}
          SRC: ${{ inputs.src }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: ${{ inputs.nshards }}
          DELAY: ${{ inputs.delay }}
          LOOPS: ${{ inputs.loops }}
          BRANCH: ${{ inputs.data_branch }}
        run: |
          cd data-repo && git config user.name "monika-crawler" && git config user.email "noreply@users.noreply.github.com" && cd ..
          n=$(( NSHARDS > 6 ? 6 : NSHARDS )); [ "$n" -lt 1 ] && n=1
          l=$(( LOOPS > 10 ? 10 : LOOPS ))
          for i in $(seq 1 "$l"); do
            python -m crawler.fetch_jars --inv "data-repo/data/inventory/$SRC.jsonl" \
              --state "data-repo/data/inventory/$SRC-state-$SHARD.jsonl" --seen "data-repo/data/inventory/$SRC-state*.jsonl" \
              --index data-repo/data/pixeldrain/index.json --delay "$DELAY" --budget-s 1800 --shard "$SHARD" --nshards "$n" 2>&1 | tee -a run.log
            grep -q "^429" run.log && break
            (cd data-repo && git add data/inventory && { git diff --cached --quiet || git commit -q -m "data: $SRC state shard $SHARD $(date -u +%H:%MZ)"; } \
              && for t in 1 2 3 4; do git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break || sleep $((RANDOM % 20 + 5)); done)
            grep -q "xong lan chay: 0 tep" run.log && break
          done
