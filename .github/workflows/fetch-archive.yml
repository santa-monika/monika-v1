name: fetch-archive
# Tai JAR cua nguon da dong tu archive.org theo danh muc (data/inventory/<src>.jsonl trong repo du lieu), kiem tra, dedupe sha256,
# dua len Pixeldrain (secret PD_KEY), ghi ket qua vao data/inventory/<src>-state.jsonl. Chay lai tiep tuc tu cho dang do. Chay tay.
on:
  workflow_dispatch:
    inputs:
      src:
        description: "gt321 hoac wvip"
        required: true
        default: "gt321"
      delay:
        description: "Giay giua hai yeu cau (nen >= 3 voi archive.org)"
        required: false
        default: "4"
      budget_s:
        description: "Dung sau chung nay giay (toi da ~19000)"
        required: false
        default: "18000"
      data_branch:
        description: "Nhanh cua repo du lieu"
        required: false
        default: "claude/project-thread-a5xs4x"

permissions:
  contents: read

concurrency:
  group: fetch-archive-${{ inputs.src }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: santa-monika/monika-sideproject
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: ${{ inputs.data_branch }}
          path: data-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiem tra PD_KEY
        env:
          PD_KEY: ${{ secrets.PD_KEY }}
        run: |
          if [ -z "$PD_KEY" ]; then echo "PD_KEY chua duoc dat trong secrets cua repo"; exit 1; fi
          echo "PD_KEY da co (${#PD_KEY} ky tu)"
      - name: Tai, kiem tra, up Pixeldrain
        env:
          PD_KEY: ${{ secrets.PD_KEY }}
          SRC: ${{ inputs.src }}
          DELAY: ${{ inputs.delay }}
          BUDGET: ${{ inputs.budget_s }}
        run: |
          python -m crawler.fetch_jars --inv "data-repo/data/inventory/$SRC.jsonl" \
            --state "data-repo/data/inventory/$SRC-state.jsonl" --index data-repo/data/pixeldrain/index.json \
            --delay "$DELAY" --budget-s "$BUDGET"
      - name: Ghi ket qua vao repo du lieu
        if: always()
        working-directory: data-repo
        env:
          SRC: ${{ inputs.src }}
        run: |
          git config user.name "monika-crawler"
          git config user.email "noreply@users.noreply.github.com"
          git add data/inventory
          if git diff --cached --quiet; then echo "khong co thay doi"; exit 0; fi
          git commit -m "data: $SRC fetch state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${{ inputs.data_branch }}
